<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeos – Coleção</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
:root {
  --bg: #050816;
  --bg-card: #0b1020;
  --accent: #ff4b81;
  --accent-soft: rgba(255, 75, 129, 0.15);
  --text: #f5f5f7;
  --muted: #a0a3b1;
  --radius-lg: 18px;
  --radius-md: 10px;
  --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
  --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

    body {
      margin: 0;
      padding: 40px 24px;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 960px;
      flex: 1;
    }

    header {
      margin-bottom: 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 600;
      margin: 0;
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 26px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      background-size: cover;
      background-position: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      padding-bottom: 20px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 0 4px rgba(255, 75, 129, 0.3));
      transition: filter 0.2s;
    }

    .social-icon:hover {
      filter: drop-shadow(0 0 8px rgba(255, 75, 129, 0.5));
    }

    .linkedin {
      background-image: url('https://mistralaiblackforestprod.blob.core.windows.net/images/blackforest/9fd2/6ecf/-a6c/d-410d-9de7-eaf6b37f51e1/image.jpg?se=2026-03-15T01%3A30%3A36Z&sp=r&sv=2026-02-06&sr=b&sig=SofjieA2QeUkPf0r09%2BM%2BWSs2DQ88WNlAzGBt6Ks2zM%3D');
    }

    .instagram {
      background-image: url('https://mistralaiblackforestprod.blob.core.windows.net/images/blackforest/9fd2/6ecf/-a6c/d-410d-9de7-eaf6b37f51e1/image.jpg?se=2026-03-15T01%3A30%3A36Z&sp=r&sv=2026-02-06&sr=b&sig=SofjieA2QeUkPf0r09%2BM%2BWSs2DQ88WNlAzGBt6Ks2zM%3D');
    }

    .twitter {
      background-image: url('https://mistralaiblackforestprod.blob.core.windows.net/images/blackforest/9fd2/6ecf/-a6c/d-410d-9de7-eaf6b37f51e1/image.jpg?se=2026-03-15T01%3A30%3A36Z&sp=r&sv=2026-02-06&sr=b&sig=SofjieA2QeUkPf0r09%2BM%2BWSs2DQ88WNlAzGBt6Ks2zM%3D');
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>Coleção de Vídeos</h1>
      <p>Explora os conteúdos através dos mini‑cards ou pelos QR codes.</p>
    </header>

    <div class="grid">

      <!-- CARD 1 -->
      <a class="card" href="videos/video1.html">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/3qEmi_V-7GA/hqdefault.jpg');"></div>
        <div class="title">BELL 41EP</div>
        <div class="desc">Making of..</div>
      </a>

      <!-- CARD 2 -->
      <a class="card" href="videos/video2.html">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/wfJAH_FippE/hqdefault.jpg');"></div>
        <div class="title">DF Projectos CARTOON</div>
        <div class="desc">Making of de DF carton.</div>
      </a>

      <!-- CARD 3 -->
      <a class="card" href="videos/video3.html">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/VIDEO_ID_3/hqdefault.jpg');"></div>
        <div class="title">Título do Vídeo 3</div>
        <div class="desc">Descrição simples e elegante.</div>
      </a>

    </div>

    <footer>
      © <span id="year"></span> · Página minimalista artística
      <div class="social-icons">
        <a href="https://www.linkedin.com/in/seu-perfil" target="_blank" class="social-icon linkedin"></a>
        <a href="https://www.instagram.com/seu-perfil" target="_blank" class="social-icon instagram"></a>
        <a href="https://twitter.com/seu-perfil" target="_blank" class="social-icon twitter"></a>
      </div>
    </footer>

  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
