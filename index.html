<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeos – Coleção</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root {
      --bg: #050816;
      --bg-card: #0b1020;
      --accent: #ff4b81;
      --accent-soft: rgba(255, 75, 129, 0.15);
      --text: #f5f5f7;
      --muted: #a0a3b1;
      --radius-lg: 18px;
      --radius-md: 10px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
      --font-main: "Inter", sans-serif;
    }

    body {
      margin: 0;
      padding: 40px 24px;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      margin-bottom: 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 600;
      margin: 0;
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 26px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255, 75, 129, 0.1);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      background-size: cover;
      background-position: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Estilos do Footer e Redes Sociais */
    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .social-links {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-links a {
      color: var(--muted);
      font-size: 1.4rem;
      transition: color 0.3s ease, transform 0.3s ease;
      text-decoration: none;
    }

    .social-links a:hover {
      color: var(--accent);
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>Coleção de Vídeos</h1>
      <p>Explora os conteúdos através dos mini‑cards ou pelos QR codes.</p>
    </header>

    <div class="grid">
      <a class="card" href="videos/video1.html">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/3qEmi_V-7GA/hqdefault.jpg');"></div>
        <div class="title">BELL 41EP</div>
        <div class="desc">Making of..</div>
      </a>

      <a class="card" href="videos/video2.html">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/wfJAH_FippE/hqdefault.jpg');"></div>
        <div class="title">DF Projectos CARTOON</div>
        <div class="desc">Making of de DF carton.</div>
      </a>

      <a class="card" href="videos/video3.html">
        <div class="thumb" style="background-image:url('https://img.youtube.com/vi/wfJAH_FippE/hqdefault.jpg');"></div>
        <div class="title">Título do Vídeo 3</div>
        <div class="desc">Descrição simples e elegante.</div>
      </a>
    </div>

    <footer>
      <div class="social-links">
        <a href="https://www.linkedin.com/pub/jorge-antunes/a/640/520" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://instagram.com/jmartsdesign" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://twitter.com/jmartsdesign" target="_blank" title="Twitter/X"><i class="fab fa-x-twitter"></i></a>
      </div>
      <div>
        <p>© <span id="year"></span> JMArtsDesign · Feito com ♥ e código.</p>
      </div>
    </footer>

  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
